<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Career Hub</title>
<style>
:root{--bg:#ECF0F1;--surface:#fff;--ink:#2C3E50;--ink2:#34495E;--muted:#7F8C8D;--line:#BDC3C7;--btn:#34495E;--btnink:#ECF0F1;--chip:#ECF0F1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2C3E50;--surface:#34495E;--ink:#ECF0F1;--ink2:#BDC3C7;--muted:#BDC3C7;--line:#4a617a;--btn:#BDC3C7;--btnink:#2C3E50;--chip:#2C3E50}}
:root[data-theme="dark"]{--bg:#2C3E50;--surface:#34495E;--ink:#ECF0F1;--ink2:#BDC3C7;--muted:#BDC3C7;--line:#4a617a;--btn:#BDC3C7;--btnink:#2C3E50;--chip:#2C3E50}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#2C3E50;color:#ECF0F1;padding:28px 20px 0}
.wrap{max-width:1000px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.7rem}header p{margin:0 0 16px;color:#BDC3C7}
.who{float:right;font-size:.85rem;color:#BDC3C7;background:#34495E;padding:4px 12px;border-radius:99px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:#BDC3C7;padding:10px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#ECF0F1;border-color:#ECF0F1;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.05rem}.card p{margin:0;color:var(--ink2);font-size:.92rem}
.tag{display:inline-block;background:var(--chip);color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem;margin:0 4px 4px 0}
.meta{color:var(--muted);font-size:.82rem}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.sec h2{margin:0 0 10px;font-size:1.1rem}
.bar2{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--btn)}
.note{color:var(--muted);font-size:.85rem}
.diagram{overflow-x:auto}.diagram svg{min-width:640px;width:100%;height:auto}
svg text{fill:var(--ink);font:13px system-ui,sans-serif}svg .b{fill:var(--surface);stroke:var(--ink2);stroke-width:1.5}svg .l{stroke:var(--muted);stroke-width:1.5;fill:none}svg .h{font-weight:700}svg .s{fill:var(--muted);font-size:11px}
ol li{margin-bottom:6px}
</style>
</head>
<body>
<header><div class="wrap">
<span class="who" id="who">Guest (not saved)</span>
<h1>IT Career Hub</h1>
<p>Explore IT jobs, side income ideas and the skills behind them.</p>
<nav id="nav"></nav>
</div></header>
<main id="main"></main>
<script>
const SK=[
["html","HTML & CSS","Web","Beginner","Structure and style web pages."],
["js","JavaScript","Web","Beginner","The language of the browser and a lot of servers."],
["react","React","Web","Intermediate","Component-based UI library."],
["py","Python","Programming","Beginner","Scripting, automation, data and AI."],
["sql","SQL & Databases","Data","Beginner","Query and design relational data."],
["git","Git & GitHub","Tools","Beginner","Version control and collaboration."],
["linux","Linux & Shell","Infrastructure","Intermediate","Command line and server basics."],
["cloud","Cloud (AWS/Azure)","Infrastructure","Intermediate","Deploy and run apps online."],
["docker","Docker & CI/CD","Infrastructure","Intermediate","Containers and automated pipelines."],
["net","Networking","Infrastructure","Beginner","TCP/IP, DNS, routers and Wi‑Fi."],
["sec","Security Basics","Security","Intermediate","Threats, hardening, OWASP Top 10."],
["ux","UI/UX Design","Design","Beginner","Wireframes, prototyping, usability."],
["excel","Excel & Sheets","Data","Beginner","Formulas, pivots and reporting."],
["viz","Data Visualization","Data","Intermediate","Charts and dashboards (Power BI, Tableau)."],
["ml","Machine Learning","Data","Advanced","Models, training and evaluation."],
["comm","Communication","Soft skill","Beginner","Explain tech clearly to non-tech people."]];
const JOBS=[
["j1","Frontend Developer","Software","Builds the interfaces people see and use.",["html","js","react","git"],"₱30k–90k"],
["j2","Backend Developer","Software","Designs APIs, databases and server logic.",["py","sql","git","cloud"],"₱35k–100k"],
["j3","Data Analyst","Data","Turns raw data into insights and dashboards.",["sql","excel","viz","py"],"₱28k–70k"],
["j4","Machine Learning Engineer","Data","Trains and ships models that learn from data.",["py","ml","sql","git"],"₱60k–150k"],
["j5","DevOps / Cloud Engineer","Infrastructure","Automates deployment and keeps systems running.",["linux","docker","cloud","git","net"],"₱50k–130k"],
["j6","Cybersecurity Analyst","Security","Monitors, detects and responds to threats.",["net","sec","linux","py"],"₱40k–110k"],
["j7","UI/UX Designer","Design","Designs usable, good-looking products.",["ux","html","comm"],"₱25k–80k"],
["j8","IT Support Specialist","Support","Helps users and keeps devices and networks healthy.",["net","linux","comm"],"₱18k–40k"]];
const SIDE=[
["s1","Freelance Web Developer","Build sites for small businesses.",["html","js","comm"],"Start with 2–3 portfolio sites for local shops."],
["s2","Virtual Assistant (Tech VA)","Admin, spreadsheets and tool setup for remote clients.",["excel","comm"],"Specialize in a tool such as Notion or Airtable."],
["s3","Online IT Tutor","Teach coding or office tools to students.",["comm","py"],"Record short lessons and reuse them."],
["s4","Technical Writer / Blogger","Write guides, docs and tutorials.",["comm","git"],"Publish what you learn each week."],
["s5","Micro‑SaaS / App Builder","Ship a small paid tool for a niche problem.",["js","py","cloud"],"Validate with 10 users before building more."],
["s6","Device Repair & Network Setup","Fix PCs, set up Wi‑Fi and CCTV locally.",["net","linux"],"Word of mouth is your best marketing."],
["s7","Bug Bounty Hunter","Report vulnerabilities to companies for rewards.",["sec","net","js"],"Practice on legal labs first, only test in-scope targets."]];
const TABS=[["jobs","Jobs"],["side","Sidelines"],["skills","Skills"],["me","My Profile"],["arch","Architecture"]];
const skName=id=>(SK.find(s=>s[0]===id)||[0,id])[1];
let tab="jobs",q="",cat="All",P={saved:[],skills:{}},ref=null,uname="Guest (not saved)",mode="memory";

function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e[x]=v;else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e}
const tags=a=>a.map(t=>el("span",{class:"tag"},t));
async function persist(){try{if(ref)await ref.set(P)}catch(e){console.error(e)}render()}
function toggleSave(id){const i=P.saved.indexOf(id);i<0?P.saved.push(id):P.saved.splice(i,1);persist()}
function setSkill(id,v){if(v)P.skills[id]=v;else delete P.skills[id];persist()}

function saveBtn(id){const on=P.saved.includes(id);return el("button",{class:"btn"+(on?"":" ghost"),onclick:()=>toggleSave(id)},on?"★ Saved":"☆ Save")}
function filterBar(cats){return el("div",{class:"bar"},
 el("input",{placeholder:"Search…",value:q,oninput:e=>{q=e.target.value;renderList()}}),
 cats?el("select",{onchange:e=>{cat=e.target.value;renderList()}},["All",...cats].map(c=>{const o=el("option",{value:c},c);if(c===cat)o.selected=true;return o})):"")}
let listBox;
function match(...f){return f.join(" ").toLowerCase().includes(q.toLowerCase())}
function renderList(){
 listBox.replaceChildren();
 if(tab==="jobs")JOBS.filter(j=>(cat==="All"||j[2]===cat)&&match(j[1],j[3],j[4].map(skName).join(" "))).forEach(j=>
  listBox.append(el("div",{class:"card"},el("div",{class:"meta"},j[2]),el("h3",{},j[1]),el("p",{},j[3]),el("div",{},tags(j[4].map(skName))),el("div",{class:"meta"},"Typical PH monthly pay (rough estimate): "+j[5]),el("div",{class:"row"},saveBtn(j[0])))));
 if(tab==="side")SIDE.filter(s=>match(s[1],s[2],s[3].map(skName).join(" "))).forEach(s=>
  listBox.append(el("div",{class:"card"},el("h3",{},s[1]),el("p",{},s[2]),el("div",{},tags(s[3].map(skName))),el("p",{class:"meta"},"Tip: "+s[4]),el("div",{class:"row"},saveBtn(s[0])))));
 if(tab==="skills")SK.filter(s=>(cat==="All"||s[2]===cat)&&match(s[1],s[4])).forEach(s=>{
  const sel=el("select",{onchange:e=>setSkill(s[0],e.target.value)},[["","Not started"],["learning","Learning"],["have","I have this"]].map(([v,l])=>{const o=el("option",{value:v},l);if((P.skills[s[0]]||"")===v)o.selected=true;return o}));
  listBox.append(el("div",{class:"card"},el("div",{class:"meta"},s[2]+" · "+s[3]),el("h3",{},s[1]),el("p",{},s[4]),el("div",{class:"row"},sel)))});
 if(!listBox.children.length)listBox.append(el("p",{class:"note"},"Nothing matches your search."));
}
function viewMe(m){
 const have=Object.keys(P.skills).filter(k=>P.skills[k]==="have").length,lrn=Object.keys(P.skills).filter(k=>P.skills[k]==="learning").length;
 m.append(el("div",{class:"sec"},el("h2",{},"Hello, "+(uname.split(" (")[0])),
  el("p",{},`${P.saved.length} saved items · ${have} skills owned · ${lrn} in progress`),
  el("p",{class:"note"},mode==="db"?"Your profile is stored in your private database space, so it is here next time you open the page.":"Database unavailable in this view, so changes last only until you close the page.")));
 const jobs=JOBS.filter(j=>P.saved.includes(j[0]));
 const box=el("div",{class:"sec"},el("h2",{},"Skill gap for your saved jobs"));
 if(!jobs.length)box.append(el("p",{class:"note"},"Save a job to see which skills you still need."));
 jobs.forEach(j=>{const got=j[4].filter(s=>P.skills[s]==="have").length,pct=Math.round(got/j[4].length*100),miss=j[4].filter(s=>P.skills[s]!=="have");
  box.append(el("div",{style:"margin-bottom:14px"},el("strong",{},j[1]+" — "+pct+"% ready"),el("div",{class:"bar2"},el("i",{style:"width:"+pct+"%"})),el("div",{class:"note"},miss.length?"Missing: "+miss.map(skName).join(", "):"You have every listed skill!")))});
 m.append(box);
 const sd=SIDE.filter(s=>P.saved.includes(s[0]));
 m.append(el("div",{class:"sec"},el("h2",{},"Saved sidelines"),sd.length?el("div",{},sd.map(s=>el("p",{},"• "+s[1]+" — needs "+s[3].map(skName).join(", ")))):el("p",{class:"note"},"No sidelines saved yet.")));
}
function viewArch(m){
 const B=(x,y,w,h,t,s)=>`<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text class="h" x="${x+w/2}" y="${y+24}" text-anchor="middle">${t}</text><text class="s" x="${x+w/2}" y="${y+42}" text-anchor="middle">${s}</text>`;
 const A=(d)=>`<path class="l" d="${d}" marker-end="url(#ar)"/>`;
 const svg=`<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System architecture diagram"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7F8C8D"/></marker></defs>
 <text class="s" x="10" y="16">PRESENTATION</text>${B(20,24,180,60,"Browser UI","tabs · cards · filters")}${B(260,24,180,60,"Profile view","skill gap · saved items")}
 <text class="s" x="10" y="124">APPLICATION LOGIC (page JavaScript)</text>${B(20,132,180,60,"State (P)","saved · skills")}${B(260,132,180,60,"Render engine","filter · search · DOM")}${B(500,132,180,60,"Static catalog","jobs · sidelines · skills")}
 <text class="s" x="10" y="232">PLATFORM RUNTIME</text>${B(20,240,200,60,"user capability","who is viewing? (id, name)")}${B(260,240,200,60,"db capability","get / set (permissioned)")}
 <text class="s" x="10" y="332">DATA</text>${B(120,336,460,40,"Private database: data/users/{userId}/profile","one document per user")}
 ${A("M110 84V132")}${A("M350 84V132")}${A("M200 162H260")}${A("M500 162H440")}${A("M110 192V240")}${A("M200 162C230 200 330 200 350 240")}${A("M350 300V336")}${A("M110 300V336")}
 </svg>`;
 const d=el("div",{class:"sec diagram"});d.innerHTML=svg;
 m.append(el("div",{class:"sec"},el("h2",{},"System architecture")),d);
 m.append(el("div",{class:"sec"},el("h2",{},"Application flow"),el("ol",{},
  [["Load.","The browser opens the page. The job, sideline and skill catalog is bundled in the page, so browsing works instantly and offline from the database."],
   ["Identify.","The page asks the user capability who is viewing. Each person gets a unique opaque ID, which is how different users are kept apart."],
   ["Fetch profile.","Using that ID the page reads one document at data/users/{userId}/profile. If none exists, a blank profile is created."],
   ["Browse.","Search and category filters run in the render engine against the static catalog and redraw the cards, with no server round trip."],
   ["Interact.","Saving a job or marking a skill as Learning or Have updates the in-memory state P."],
   ["Persist.","After each change the page writes P back to the user’s document through the db capability. The platform enforces permissions, so one user cannot read another’s private data."],
   ["Analyze.","The My Profile tab compares saved jobs with the skills you marked as owned, then shows readiness percentages and missing skills."]].map(([a,b])=>el("li",{},el("strong",{},a+" "),b)))),
  el("div",{class:"sec"},el("h2",{},"Data model"),el("pre",{style:"margin:0;overflow-x:auto;font-size:.85rem"},'data/users/{userId}/profile\n{\n  saved:  ["j1", "s3", ...],\n  skills: { "py": "have", "sql": "learning" }\n}')));
}
function render(){
 const nav=$("#nav");nav.replaceChildren(...TABS.map(([k,l])=>el("button",{class:k===tab?"on":"",onclick:()=>{tab=k;q="";cat="All";render()}},l)));
 $("#who").textContent=uname;
 const m=$("#main");m.replaceChildren();
 if(tab==="me")return viewMe(m);
 if(tab==="arch")return viewArch(m);
 const cats=tab==="jobs"?[...new Set(JOBS.map(j=>j[2]))]:tab==="skills"?[...new Set(SK.map(s=>s[2]))]:null;
 m.append(filterBar(cats));listBox=el("div",{class:"grid"});m.append(listBox);renderList();
}
const $=s=>document.querySelector(s);
render();
(async()=>{
 try{
  const user=await claude.use("user"),db=await claude.use("db");
  if(!db||!user)return;
  const id=await user.id();let n="";
  try{n=(await user.me()).name}catch(e){}
  ref=db.collection("data/users/"+id).doc("profile");
  const snap=await ref.get();
  if(snap.exists){const d=snap.data()||{};P={saved:Array.isArray(d.saved)?d.saved:[],skills:d.skills&&typeof d.skills==="object"?d.skills:{}}}
  mode="db";uname=n||"Signed in";render();
 }catch(e){console.error(e)}
})();
</script>
</body>
</html>
